name: Sandbox environment branch canary
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Synthetic canary input
        required: true
        type: string
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: isolated-check-main
      deployment: false
    steps:
      - name: Check synthetic canary presence
        env:
          SANDBOX_ENV_CANARY: ${{ secrets.SANDBOX_ENV_CANARY }}
        run: |
          if test -n "$SANDBOX_ENV_CANARY"; then
            echo "CANARY_PRESENT"
            exit 1
          fi
          echo "JOB_STARTED_WITHOUT_CANARY"
